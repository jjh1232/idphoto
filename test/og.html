<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  og.png 의 원본. 배포되는 파일이 아니라 그림을 만드는 틀이다 (public/ 밖이라 공개되지 않는다).
  다시 만들기: npm run og  → public/og.png (1200×630, 트위터·카톡·슬랙 공통 크기)

  한 장을 세 언어가 같이 쓴다. 그래서 문구는 짧게 세 언어를 겹쳐 두고,
  나머지는 **숫자**로 말한다 — 이 도구가 내놓는 것이 mm 와 dpi 라서 그게 제일 잘 통한다.

  색은 global.css 의 토큰과 같은 값이다 (헌법 §12). 여기서만 바꾸면 미리보기와
  실제 화면의 인상이 갈린다.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff; color: #161616;
    font: 15px/1.6 "Malgun Gothic", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; gap: 72px;
    padding: 0 84px;
  }
  .left { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .brand { font-size: 22px; letter-spacing: .1em; color: #707078; }
  h1 { font-size: 62px; line-height: 1.12; letter-spacing: -.025em; }
  .sub { font-size: 25px; color: #47474f; }
  .sizes { display: flex; gap: 12px; }
  .sizes span {
    font: 600 22px/1 Consolas, "Malgun Gothic", monospace; color: #2a4a86;
    border: 2px solid #2a4a86; border-radius: 8px; padding: 10px 16px;
  }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; }
  .badges span {
    font-size: 20px; color: #2a4a86; background: #eaf0f9;
    border: 1px solid rgba(42,74,134,.3); border-radius: 999px; padding: 7px 20px;
  }

  /* 오른쪽: 규격 틀 하나. 도구가 하는 일이 「이 비율로 자르는 것」 이라 그림이 곧 설명이다. */
  .frame {
    flex: 0 0 auto;
    width: 300px; height: 400px;          /* 30×40 mm 비율 */
    border: 3px solid #161616; border-radius: 6px;
    background: #f5f5fa;
    position: relative;
  }
  .band {
    position: absolute; left: 0; right: 0;
    background: rgba(42,74,134,.13);
    border-top: 2px solid rgba(42,74,134,.5);
    border-bottom: 2px solid rgba(42,74,134,.5);
  }
  .band b {
    position: absolute; right: 10px; bottom: 4px;
    font: 500 16px/1 "Malgun Gothic", sans-serif; color: #2a4a86;
  }
  /* 머리 끝 3~5mm, 턱 28~35mm — 40mm 틀에 대한 비율 그대로 */
  .head { top: 7.5%; height: 5%; }
  .chin { top: 70%; height: 17.5%; }
  .tag {
    position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%);
    font: 600 20px/1 Consolas, monospace; color: #707078; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">prelaps · photo</div>
    <h1>증명사진 규격 맞추기</h1>
    <p class="sub">Passport &amp; résumé photo sizes · 証明写真のサイズ調整</p>
    <div class="sizes"><span>30×40</span><span>35×45</span><span>2×2 in</span></div>
    <div class="badges">
      <span>사진이 기기 밖으로 안 나감</span>
      <span>가입 없음</span>
      <span>무료</span>
    </div>
  </div>

  <div class="frame">
    <div class="band head"><b>머리 끝</b></div>
    <div class="band chin"><b>턱</b></div>
    <div class="tag">30 × 40 mm · 300 dpi</div>
  </div>
</body>
</html>
